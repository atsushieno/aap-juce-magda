plugins {
    id 'com.android.application'
}

android {
    namespace 'org.androidaudioplugin.ports.juce.magda'
    compileSdk 37
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'org.androidaudioplugin.ports.juce.magda'
        minSdk 29
        targetSdk 37
        versionCode 1
        versionName '0.1.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake {
                arguments "-DCMAKE_BUILD_TYPE=Release", '-DJUCEAAP_ENABLED=1',
                        '-DMAGDA_FAUST_BACKEND=interp',
                        '-DANDROID_STL=c++_shared',
                        '-DANDROID_CPP_FEATURES=exceptions rtti'
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.31.5'
        }
    }

    sourceSets {
        main.java.srcDirs += [
            "${rootProject.projectDir}/external/magda-core/third_party/JUCE/modules/juce_core/native/javacore/app",
            "${rootProject.projectDir}/external/magda-core/third_party/JUCE/modules/juce_core/native/java/app",
            "${rootProject.projectDir}/external/magda-core/third_party/JUCE/modules/juce_gui_basics/native/javaopt/app",
            "${rootProject.projectDir}/external/magda-core/third_party/JUCE/modules/juce_gui_basics/native/java/app",
            "${rootProject.projectDir}/external/magda-core/third_party/JUCE/modules/juce_audio_devices/native/java/app"
        ]
        main.assets.srcDirs += [
            "${rootProject.projectDir}/external/magda-core/lang"
        ]
    }

    buildFeatures { prefab true }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        // JUCE's JuceMidiSupport triggers known Android Bluetooth permission lint findings.
        abortOnError = false
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.startup:startup-runtime:1.2.0'
    implementation libs.aap.core
}

apply from: '../external/aap-juce/gradle/aap-juce.gradle'

tasks.register('fetchMagdaFont', Exec) {
    workingDir rootProject.file('external/magda-core')
    commandLine 'git', 'lfs', 'pull', '--include=assets/fonts/NotoSansCJKsc-Regular.otf'
    onlyIf {
        def font = rootProject.file('external/magda-core/assets/fonts/NotoSansCJKsc-Regular.otf')
        !font.isFile() || (font.length() < 1024 &&
                font.getText('UTF-8').startsWith('version https://git-lfs.github.com/spec/'))
    }
}

tasks.named('prepareAapJuce') {
    dependsOn tasks.named('fetchMagdaFont')
}
